<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohara · teste da Etapa 0</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D3D24">
<link rel="icon" href="icone-192.png">
<style>
:root{--bg:#F1F1EF;--cx:#fff;--tx:#141414;--tx2:#6E6E73;--ln:#E2E2E4;--ok:#1B7A47;--ruim:#C0204A}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--cx:#1C1C20;--tx:#EDEDEF;--tx2:#9B9BA3;--ln:#2C2C32;--ok:#6FD39B;--ruim:#FF7A9A}}
*{box-sizing:border-box}body{margin:0;padding:24px 18px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto}h1{font-weight:300;font-size:28px;margin:0 0 4px;display:flex;gap:12px;align-items:center}h1 img{border-radius:22%}
p{color:var(--tx2);margin:0 0 18px}.c{background:var(--cx);border-radius:20px;padding:6px 20px}
.l{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.l:last-child{border:0}.l small{display:block;color:var(--tx2);font-size:12px}
.v{font-weight:600;text-align:right}.ok{color:var(--ok)}.ruim{color:var(--ruim)}
button{margin-top:16px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:600;background:var(--tx);color:var(--bg)}
.selo{display:inline-block;background:#F6C21B;color:#2B1B00;font-weight:700;padding:6px 14px;border-radius:99px;margin:0 0 16px}</style></head><body><main>
<h1><img src="icone-192.png" width="40" height="40" alt="">Ohara · teste</h1>
<p>Página de teste da Etapa 0. Nada daqui é o app de verdade.</p>
<p class="selo">Batata · versão 5</p>
<p><a href="lab.html" style="font-weight:600;color:var(--tx)">Abrir o laboratório (testes de PDF, banco e atalho) ›</a></p>
<div class="c" id="lista"></div>
<button id="pedir">Pedir armazenamento persistente</button>
<p id="msg" style="margin-top:14px"></p>
<script>
const $=s=>document.querySelector(s);
const linha=(t,sub,v,cls)=>`<div class="l"><div>${t}<small>${sub}</small></div><div class="v ${cls||''}">${v}</div></div>`;
const MB=b=>b==null?'?':(b/1048576).toFixed(0)+' MB';
async function atualizar(){
  const L=[];
  let reg=null,ativo='não',controla='não';
  if('serviceWorker' in navigator){reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.active)ativo='sim';if(navigator.serviceWorker.controller)controla='sim'}
  L.push(linha('Service worker','guarda a página para abrir sem internet',ativo==='sim'?'ativo':'não ativo',ativo==='sim'?'ok':'ruim'));
  L.push(linha('Página servida pelo service worker','sim = esta carga veio do aparelho',controla==='sim'?'sim':'ainda não (recarregue)',controla==='sim'?'ok':''));
  let n='?';try{const c=await caches.open('ohara-teste-v5');n=(await c.keys()).length+' arquivos'}catch(e){}
  L.push(linha('Arquivos guardados no aparelho','cache do app',n));
  L.push(linha('Internet agora','',navigator.onLine?'online':'sem internet',navigator.onLine?'ok':'ruim'));
  const inst=matchMedia('(display-mode: standalone)').matches;
  L.push(linha('Aberto como app instalado','tela cheia, sem barra do navegador',inst?'sim':'não (aba do navegador)',inst?'ok':''));
  let per='?',cota='?',uso='?';
  try{per=(await navigator.storage.persisted())?'sim':'não';const e=await navigator.storage.estimate();cota=MB(e.quota);uso=MB(e.usage)}catch(e){}
  L.push(linha('Armazenamento persistente','o navegador não apaga os dados sozinho',per,per==='sim'?'ok':'ruim'));
  L.push(linha('Espaço disponível / usado','estimativa do navegador',cota+' / '+uso));
  let k=+localStorage.getItem('aberturas')||0;
  L.push(linha('Vezes que esta página foi aberta','guardado neste aparelho',String(k)));
  const ua=navigator.userAgent;const nav=/SamsungBrowser/.test(ua)?'Samsung Internet':/Firefox/.test(ua)?'Firefox':/Edg/.test(ua)?'Edge':/Chrome/.test(ua)?'Chrome':'outro';
  L.push(linha('Navegador','para eu saber onde foi testado',nav+(/Android/.test(ua)?' (Android)':'')));
  L.push(linha('Pedido de armazenamento persistente','existe neste navegador?',(navigator.storage&&navigator.storage.persist)?'sim':'não'));
  L.push(linha('Carregada em','',new Date().toLocaleString('pt-BR')));
  $('#lista').innerHTML=L.join('');
}
localStorage.setItem('aberturas',(+localStorage.getItem('aberturas')||0)+1);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(atualizar).catch(atualizar);
addEventListener('online',atualizar);addEventListener('offline',atualizar);
$('#pedir').onclick=async()=>{
  const m=$('#msg');m.textContent='Pedindo…';
  let r;try{
    if(!(navigator.storage&&navigator.storage.persist)){r='este navegador não oferece esse recurso.'}
    else{const antes=await navigator.storage.persisted();const ok=await navigator.storage.persist();
      r=ok?'CONCEDIDO: o navegador não vai apagar os dados sozinho.':'NEGADO: o navegador recusou (antes do pedido: '+(antes?'já era persistente':'não era persistente')+'). No Chrome não há pergunta: ele decide sozinho e costuma conceder quando o app está instalado ou é muito usado. No Firefox deveria aparecer uma pergunta de permissão.'}
  }catch(e){r='ERRO: '+e.name+' - '+e.message}
  m.textContent='Resposta do navegador às '+new Date().toLocaleTimeString('pt-BR')+': '+r;atualizar()};
atualizar();
</script></main></body></html>
